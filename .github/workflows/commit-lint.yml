name: First commit message adheres to guidelines

on:
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: lts/*

permissions:
  contents: read

jobs:
  lint-commit-message:
    runs-on: ubuntu-slim
    steps:
      - name: Compute number of commits in the PR
        id: nb-of-commits
        run: |
          echo "plusOne=$((${{ github.event.pull_request.commits }} + 1))" >> $GITHUB_OUTPUT
          echo "minusOne=$((${{ github.event.pull_request.commits }} - 1))" >> $GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: ${{ steps.nb-of-commits.outputs.plusOne }}
          persist-credentials: false
      - run: git reset HEAD^2
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate commit message
        run: |
          echo "::add-matcher::.github/workflows/commit-lint-problem-matcher.json"
          FIRST_NON_BOT_COMMIT=$(git rev-list --reverse HEAD~${{ steps.nb-of-commits.outputs.minusOne }}..HEAD | while read -r commit; do
            author=$(git show -s --format=%an "$commit")
            if [[ ! "$author" =~ \[bot\]$ ]]; then
              echo "$commit"
              break
            fi
          done)

          if [ -z "$FIRST_NON_BOT_COMMIT" ]; then
            echo "No non-bot commits found in the pull request, skipping commit message validation."
            exit 0
          fi

          echo "$FIRST_NON_BOT_COMMIT" | xargs npx -q core-validate-commit --no-validate-metadata --tap
